<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Analisador de números</title>
</head>
<body>
    <h1>Analisador de Números</h1>
    <section>
        <form action="" method="post">
            <label for="inum">Número (entre 1 e 100):</label>
            
            <input type="number" name="num" id="inum">
            
            <input type="button" value="Adicionar" class="botao" onclick="adicionar()"><br>
            
            <select name="val" id="ival" size="6"></select><br>

            <input type="button" value="Finalizar" class="botao" onclick="finalizar()">
        </form>
        <div id="resultado"></div>
    </section>
    
    <footer>@Elisa Ranikelly</footer>

    <script src="script.js"></script>
</body>
</html>
